<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Songs | Ya! Music Chris
    </title>

    <link rel="icon"
    href="https://yamusicchris.github.io/icon.png">

    <link rel="stylesheet"
    href="style.css">

</head>

<body>

<header>

    <img 
    src="https://yamusicchris.github.io/icon.png"
    alt="Ya! Music Chris">

    <nav>
        <a href="https://yamusicchris.github.io/EN/">
            Home
        </a>
    </nav>

</header>

<section class="hero">

    <h1>
        Official Songs
    </h1>

    <p>
        Listen to all the official songs by
        Ya! Music Chris directly from our music player.
    </p>

</section>

<section 
class="songs"
id="songs">
</section>

<!-- =========================
     PLAYER
========================= -->

<div class="player">

    <div class="player-left">

        <img 
        id="player-cover"
        src="https://yamusicchris.github.io/icon.png"
        alt="Cover">

        <div class="player-info">

            <div id="player-title">

                Select a song

            </div>

            <div id="player-artist">

                Ya! Music Chris

            </div>

        </div>

    </div>

    <div class="player-center">

        <div class="player-controls">

            <button 
            id="prev-btn"
            class="player-btn"
            aria-label="Previous">

                <img
                src="https://yamusicchris.github.io/icons-repro/previous.png"
                alt="Previous">

            </button>

            <button 
            id="play-btn"
            class="player-btn main"
            aria-label="Play">

                <img
                src="https://yamusicchris.github.io/icons-repro/play.png"
                alt="Play">

            </button>

            <button 
            id="next-btn"
            class="player-btn"
            aria-label="Next">

                <img
                src="https://yamusicchris.github.io/icons-repro/next.png"
                alt="Next">

            </button>

        </div>

        <div class="progress">

            <span id="current-time">
                0:00
            </span>

            <input 
            id="progress"
            type="range"
            min="0"
            max="100"
            value="0">

            <span id="duration">
                0:00
            </span>

        </div>

    </div>

    <div class="player-right">

        <span>
            🔊
        </span>

        <input
        id="volume"
        type="range"
        min="0"
        max="100"
        value="100">

    </div>

</div>

<footer>

    © 2023–2026 Ya! Music Chris.
    All rights reserved.

</footer>

<script src="app.js"></script>

</body>

</html>

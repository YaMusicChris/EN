<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="icon" href="https://yamusicchris.github.io/icon.png" type="image/x-icon">
    <style>
        /* Embedded CSS */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
        }
        a {
            color: #1DB954;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            background-color: #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        header img {
            height: 50px;
        }
        nav a {
            margin-left: 2rem;
            font-weight: bold;
        }
        section {
            padding: 4rem 2rem;
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }
        .hero img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 2rem;
        }
        footer {
            text-align: center;
            padding: 2rem;
            background-color: #1a1a1a;
            margin-top: 2rem;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 1000px; /* Change this value if you want a different maximum width */
            margin: 0 auto;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 12px; /* Optional */
        }

        .video-container iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<header>
    <img src="https://yamusicchris.github.io/icon.png" alt="Ya! Music Chris Logo">
    <nav>
        <a href="https://yamusicchris.github.io/EN/songs/">Songs</a>
    </nav>
</header>

<section class="hero">
    <div class="video-container">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/vVIJOP2ov_M?si=O5uKXr5nePIms8-P" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <h1>Welcome to the official Ya! Music Chris website!</h1>

    <p>
        This is a musical space of Ya! Music Chris, where you can listen to music without ads by selecting 'Songs'.
    </p>
</section>

<footer>
    &copy; 2023 - 2026 Ya! Music Chris. All rights reserved.
</footer>

<script>
    console.log("Welcome to your browser's console, and welcome to the official Ya! Music Chris platform in English.");
</script>

</body>
</html>
